name: Test, Build, and Deploy | Modul 01 Lab2.2 Sentor Project

on:
  push:
    branches: [main]
    
jobs:
  test-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
        
    steps:
      - uses: actions/checkout@v6
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node-version}}
          cache: "npm"
      - run: npm i
      - run: npm run build