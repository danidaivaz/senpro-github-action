name: Test, Build, and Deploy | Modul 01 Lab2.2 Sentor Project
on:
  push:
    branches: [main]
jobs:
  test-bulld:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: 16.x
        
    steps:
      - uses: actions/checkout@v2
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v2
        with:
          node-version: ${{matrix.node-version}}
          cache: "npm"
      - run: npm i
      - run: npm run build